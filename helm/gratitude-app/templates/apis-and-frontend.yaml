apiVersion: apps/v1
kind: Deployment
metadata:
  name: files-service-deployment
spec:
  replicas: {{ .Values.services.filesService.replicas }}
  selector:
    matchLabels:
      app: files-service
  template:
    metadata:
      labels:
        app: files-service
    spec:
      containers:
        - name: files-service
          image: {{ .Values.services.filesService.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.services.filesService.port }}
          env:
            - name: PORT
              value: "{{ .Values.services.filesService.port }}"
            - name: S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: gratitude-config
                  key: MINIO_ENDPOINT
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: gratitude-config
                  key: MINIO_BUCKET
            - name: S3_ACCESS_KEY_ID
              value: {{ .Values.services.minio.rootUser | quote }}
            - name: S3_SECRET_ACCESS_KEY
              value: {{ .Values.services.minio.rootPassword | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: files-service-cluster-ip-service
spec:
  type: ClusterIP
  selector:
    app: files-service
  ports:
    - port: 5004
      targetPort: {{ .Values.services.filesService.port }}
---
apiVersion: apps/v1
kind: Deployment
