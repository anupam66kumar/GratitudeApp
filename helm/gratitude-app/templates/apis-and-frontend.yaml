    spec:
      containers:
        - name: client
          image: {{ .Values.services.client.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.services.client.containerPort }}
---
apiVersion: v1
kind: Service
metadata:
  name: client-cluster-ip-service
spec:
  type: ClusterIP
  selector:
    component: client
  ports:
    - port: 3000
      targetPort: {{ .Values.services.client.containerPort }}
