apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-deployment
spec:
  replicas: {{ .Values.services.apiGateway.replicas }}
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: {{ .Values.services.apiGateway.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.services.apiGateway.port }}
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: gratitude-config
                  key: PORT
            - name: ENTRIES_SERVICE_ADDR
              valueFrom:
                configMapKeyRef:
                  name: gratitude-config
                  key: ENTRIES_SERVICE_ADDR
            - name: OPENAI_MODEL
              valueFrom:
                configMapKeyRef:
                  name: gratitude-config
                  key: OPENAI_MODEL
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-api-secret
                  key: OPENAI_API_KEY
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.services.apiGateway.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.services.apiGateway.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-cluster-ip-service
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - port: {{ .Values.services.apiGateway.port }}
      targetPort: {{ .Values.services.apiGateway.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: server-cluster-ip-service
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 5000
      targetPort: 5000
    - name: legacy
      port: 5001
      targetPort: 5000
---
