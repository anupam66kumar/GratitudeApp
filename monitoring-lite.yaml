defaultRules:
  create: false

grafana:
  adminPassword: "admin"
  defaultDashboardsEnabled: false
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 500m
      memory: 768Mi
    requests:
      cpu: 100m
      memory: 256Mi
  livenessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 120
    periodSeconds: 30
    timeoutSeconds: 15
    failureThreshold: 10
  readinessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 60
    periodSeconds: 15
    timeoutSeconds: 15
    failureThreshold: 10
  sidecar:
    dashboards:
      enabled: false
    datasources:
      enabled: true
      resources:
        limits:
          cpu: 100m
          memory: 128Mi
        requests:
          cpu: 20m
          memory: 64Mi

prometheus:
  prometheusSpec:
    scrapeInterval: 30s
    evaluationInterval: 30s
    retention: 6h
    resources:
      limits:
        cpu: 800m
        memory: 768Mi
      requests:
        cpu: 150m
        memory: 384Mi
    # Prevent Prometheus probe timeouts under load
    probeTimeoutSeconds: 15

alertmanager:
  enabled: false

nodeExporter:
  enabled: false

kubeStateMetrics:
  enabled: true
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 20m
      memory: 32Mi
