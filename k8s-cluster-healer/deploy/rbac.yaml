apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-cluster-healer-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-cluster-healer-role
rules:
- apiGroups: [""]
  resources: ["pods", "pods/status"]
  verbs: ["get", "list", "watch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-cluster-healer-binding
subjects:
- kind: ServiceAccount
  name: k8s-cluster-healer-sa
  namespace: default
roleRef:
  kind: ClusterRole
  name: k8s-cluster-healer-role
  apiGroup: rbac.authorization.k8s.io
