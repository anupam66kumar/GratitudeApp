apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-api
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # AI routes: /api/ai/healthz -> /ai/healthz
          - path: /api/(ai/.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: api-gateway-cluster-ip-service
                port:
                  number: 5000

          # Moods routes: /api/moods/all -> /all, /api/moods -> /
          - path: /api/moods/?(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: moods-api-cluster-ip-service
                port:
                  number: 5002

          # Stats routes: /api/stats/(.*) -> /$1 (e.g. /overview)
          - path: /api/stats/?(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: stats-api-cluster-ip-service
                port:
                  number: 5003

          # Files routes: /api/files/(.*) -> /$1 (e.g. /list)
          - path: /api/files/?(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: files-service-cluster-ip-service
                port:
                  number: 5004

          # Journal routes: /api/journal/entries/all -> /entries/all
          - path: /api/journal/?(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: server-cluster-ip-service
                port:
                  number: 5000

          # Server routes: /api/server/values/all -> /values/all
          - path: /api/server/?(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: server-cluster-ip-service
                port:
                  number: 5000

          # Fallback /api/ entries
          - path: /api/?(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: server-cluster-ip-service
                port:
                  number: 5000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-client
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client-cluster-ip-service
                port:
                  number: 3000
